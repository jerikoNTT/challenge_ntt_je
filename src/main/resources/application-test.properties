# ============================================
# TESTING PROFILE (application-test.properties)
# ============================================
# Activar con: java -jar app.jar --spring.profiles.active=test

# DataSource - H2 In-Memory Database (for unit tests)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true

# JPA / Hibernate - Testing
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=create-drop

# Logging - WARNING for tests (less noise)
logging.level.root=WARN
logging.level.api_ntt_challenge=INFO
logging.level.org.springframework.test=INFO

# JWT Configuration - Testing (1 hour)
jwt.secret=test-secret-minimo-32-caracteres-para-testing-xxx
jwt.expiration=3600000

# CORS - Allow test origins
app.cors.allowed-origins=http://localhost:8080
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*
