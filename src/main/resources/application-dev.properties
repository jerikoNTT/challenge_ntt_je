# ============================================
# DEVELOPMENT PROFILE (application-dev.properties)
# ============================================
# Activar con: java -jar app.jar --spring.profiles.active=dev

# DataSource - Local PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/ntt_dev
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate - Development
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Logging - DEBUG for development
logging.level.root=INFO
logging.level.api_ntt_challenge=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# JWT Configuration - Development (24 hours)
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000

# CORS - Allow localhost
app.cors.allowed-origins=http://localhost:3000,http://localhost:8080,http://localhost:4200
app.cors.allowed-methods=*
app.cors.allowed-headers=*
