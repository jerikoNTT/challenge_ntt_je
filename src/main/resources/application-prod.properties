# ============================================
# PRODUCTION PROFILE (application-prod.properties)
# ============================================
# Activar con: java -jar app.jar --spring.profiles.active=prod

# DataSource - Cloud Database (AWS RDS, Azure, etc)
# Use environment variables for sensitive data
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://prod-db:5432/ntt_prod}
spring.datasource.username=${DATABASE_USER:admin}
spring.datasource.password=${DATABASE_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate - Production
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000

# Logging - ERROR only for production
logging.level.root=ERROR
logging.level.api_ntt_challenge=INFO
logging.level.org.springframework.web=WARN

# JWT Configuration - Production (1 hour)
# Use strong, random secret from environment variable
jwt.secret=${JWT_SECRET:CHANGE_THIS_IN_PRODUCTION_USE_ENV_VAR_MINIMUM_32_CHARS}
jwt.expiration=3600000

# CORS - Only allowed domains in production
app.cors.allowed-origins=https://api.example.com,https://www.example.com
app.cors.allowed-methods=GET,POST,PUT,DELETE
app.cors.allowed-headers=Content-Type,Authorization

# Server Configuration
server.compression.enabled=true
server.http2.enabled=true
